name: Publish Release to Website

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  push-release:
    runs-on: ubuntu-latest
    steps:
      - name: Create release on website repo
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.WEBSITE_RELEASE_TOKEN }}
          script: |
            const release = context.payload.release;
            const gameRepo = context.repo.repo;
            const tagName = `${gameRepo}-${release.tag_name}`;
            const body = [
              `Source: ${context.repo.owner}/${gameRepo} — [${release.tag_name}](${release.html_url})`,
              '',
              release.body || ''
            ].join('\n');

            await github.rest.repos.createRelease({
              owner: 'picklecastlestudios',
              repo: 'website',
              tag_name: tagName,
              name: `${gameRepo}: ${release.name || release.tag_name}`,
              body,
              target_commitish: 'main'
            });
